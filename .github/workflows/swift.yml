name: Swift
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # Only run when something that can change the result changes. Docs-only
      # pull requests do not need the Swift build, and the lint, markdown and
      # justfile workflows still run on them. No status check here is required
      # by branch protection, so a skipped run does not block a merge.
      - '**.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Resources/**'
      - 'scripts/**'
      - 'config.example.toml'
      - 'justfile'
      - '.mise.toml'
      - '.github/workflows/swift.yml'
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: xcode-27
    env:
      # Match local Apple Swift 6.4 instead of the runner's default Xcode.
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Toolchain
        id: toolchain
        run: |
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          if [[ "$swift_version" != *"Apple Swift version 6.4 ("* ]]; then
            echo "Expected Apple Swift 6.4 from the Xcode 27.0 Command Line Tools." >&2
            exit 1
          fi
          echo "version=$(printf '%s\n' "$swift_version" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cache
            .build/checkouts
            .build/repositories
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.resolved') }}
      - run: just test
